<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whack-a-Mole – GameHub</title>
  <meta name="description" content="Play Whack-a-Mole online free. Hit the moles as fast as you can!" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔨</text></svg>" />
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    .mole-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 360px;
      margin: 0 auto;
    }
    .hole {
      aspect-ratio: 1;
      background: #1a1a2e;
      border-radius: 50%;
      border: 3px solid #2a2a45;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 2.4rem;
      transition: transform 0.08s, background 0.1s;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .hole.active {
      background: #2e1065;
      border-color: var(--accent);
      transform: scale(1.05);
    }
    .hole.hit {
      background: #14532d;
      border-color: #22c55e;
    }
    .timer-bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      margin: 0 auto 1.2rem;
      max-width: 360px;
      overflow: hidden;
    }
    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #22c55e);
      width: 100%;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div class="game-page">
    <a href="../index.html" class="back-link">← Back to GameHub</a>
    <h1>🔨 Whack-a-Mole</h1>
    <p class="game-info">Tap the moles before they disappear!</p>

    <div class="score-bar">
      <div class="score-item">Score: <span id="score">0</span></div>
      <div class="score-item">Time: <span id="time">30</span>s</div>
      <div class="score-item">Best: <span id="best">0</span></div>
    </div>

    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>

    <div class="mole-grid" id="grid"></div>

    <div class="controls">
      <button class="btn" id="startBtn">Start Game</button>
      <button class="btn btn-secondary" id="soundBtn">🔊 Sound</button>
    </div>

    **Summary:**
❓ How to play
      <div class="how-to-body">
        <ul>
          <li>Click / tap a mole when it appears</li>
          <li>Each hit = +1 point</li>
          <li>You have 30 seconds</li>
          <li>Missed moles give no points — be fast!</li>
        </ul>
      </div>
  </div>

  <script src="../js/sounds.js"></script>
  <script src="../js/leaderboard.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const bestEl = document.getElementById('best');
    const startBtn = document.getElementById('startBtn');
    const timerFill = document.getElementById('timerFill');
    const soundBtn = document.getElementById('soundBtn');
    soundBtn.textContent = GameSounds.isEnabled() ? '🔊 Sound' : '🔇 Muted';
    soundBtn.addEventListener('click', () => {
      soundBtn.textContent = GameSounds.toggle() ? '🔊 Sound' : '🔇 Muted';
    });

    let holes = [];
    let score = 0;
    let timeLeft = 30;
    let best = Number(localStorage.getItem('whackBest') || 0);
    let playing = false;
    let moleTimer, gameTimer, activeIndex = -1;

    bestEl.textContent = best;

    for (let i = 0; i < 9; i++) {
      const hole = document.createElement('div');
      hole.className = 'hole';
      hole.innerHTML = '🕳️';
      hole.dataset.i = i;
      hole.addEventListener('click', () => hit(i));
      grid.appendChild(hole);
      holes.push(hole);
    }

    function hit(i) {
      if (!playing || i !== activeIndex) return;
      score++;
      scoreEl.textContent = score;
      GameSounds.hit();
      holes[i].classList.add('hit');
      holes[i].textContent = '💥';
      clearTimeout(moleTimer);
      setTimeout(() => {
        holes[i].classList.remove('active', 'hit');
        holes[i].textContent = '🕳️';
        activeIndex = -1;
        if (playing) spawnMole();
      }, 200);
    }

    function spawnMole() {
      if (activeIndex >= 0) {
        holes[activeIndex].classList.remove('active');
        holes[activeIndex].textContent = '🕳️';
      }
      activeIndex = Math.floor(Math.random() * 9);
      holes[activeIndex].classList.add('active');
      holes[activeIndex].textContent = '🐹';
      const speed = Math.max(500, 1100 - score * 30);
      moleTimer = setTimeout(() => {
        if (activeIndex >= 0) {
          holes[activeIndex].classList.remove('active');
          holes[activeIndex].textContent = '🕳️';
          activeIndex = -1;
        }
        if (playing) spawnMole();
      }, speed);
    }

    function start() {
      if (playing) return;
      playing = true;
      score = 0;
      timeLeft = 30;
      scoreEl.textContent = 0;
      timeEl.textContent = 30;
      timerFill.style.width = '100%';
      startBtn.textContent = 'Playing...';
      startBtn.disabled = true;
      spawnMole();
      gameTimer = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;
        timerFill.style.width = (timeLeft / 30 * 100) + '%';
        if (timeLeft <= 0) end();
      }, 1000);
    }

    function end() {
      playing = false;
      clearInterval(gameTimer);
      clearTimeout(moleTimer);
      if (activeIndex >= 0) {
        holes[activeIndex].classList.remove('active');
        holes[activeIndex].textContent = '🕳️';
        activeIndex = -1;
      }
      GameSounds.success();
      if (score > best) {
        best = score;
        localStorage.setItem('whackBest', best);
        bestEl.textContent = best;
      }
      Leaderboard.submit('whack', score, true);
      startBtn.textContent = 'Play Again';
      startBtn.disabled = false;
      alert('Time\'s up! Score: ' + score + (score >= best ? ' 🎉 New best!' : ''));
    }

    startBtn.addEventListener('click', start);
  </script>
</body>
</html>
